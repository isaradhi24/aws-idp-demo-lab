name: AWS IDP Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

      confirm_apply:
        description: "Type APPLY to confirm deployment"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-idp-demo-lab-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC audience: ${payload.aud}`);
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`Repository: ${payload.repository}`);
            core.info(`Ref: ${payload.ref}`);

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149703445367:role/aws-idp-demo-lab-github-actions-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
        
      - name: Test S3 permissions
        run: |
          aws s3api get-bucket-accelerate-configuration \
            --bucket aws-idp-demo-lab-149703445367-us-east-1

          echo "S3 acceleration API succeeded"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.action == 'plan'
        run: terraform plan -input=false

      - name: Terraform Apply
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'apply' &&
          inputs.confirm_apply == 'APPLY'
        run: terraform apply -input=false -auto-approve

      - name: Terraform Destroy Plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform plan -destroy -input=false